services:
  db:
    image: postgres:16
    container_name: zerolab-db
    environment:
      POSTGRES_DB: zerolab
      POSTGRES_USER: zerolab
      POSTGRES_PASSWORD: zerolab
    ports:
      # Host 5433 — 5432 is taken by another project's container on this machine.
      - "5433:5432"
    volumes:
      - zerolab-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerolab -d zerolab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zerolab-pgdata:
